apiVersion: v1
kind: Namespace
metadata:
  name: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
stringData:
  POSTGRESQL_USER: webapp
  POSTGRESQL_PASSWORD: webapp-demo-pw
  POSTGRESQL_DATABASE: notes
---
# The app runs with fixed UIDs (postgres 26, frontend 1001) instead of the
# namespace's random UID range, so data on the volumes stays readable after a
# restore or failover into a new namespace. nonroot-v2 allows any non-root UID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-scc-nonroot-v2
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: webapp
    namespace: webapp-demo-napp
---
# Database data on NetApp ONTAP (Trident)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ontap-nas-sc
  resources:
    requests:
      storage: 5Gi
---
# Shared uploads volume (RWX) used by all frontend replicas
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ontap-nas-sc
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: webapp-demo-napp
  labels:
    app: postgres
    app.kubernetes.io/part-of: webapp-demo
    app.openshift.io/runtime: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        openshift.io/required-scc: nonroot-v2
    spec:
      serviceAccountName: webapp
      securityContext:
        runAsNonRoot: true
        runAsUser: 26   # "postgres" user of the image
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container", "--live"]
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-code
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
data:
  app.py: |
    import os, socket, time
    from flask import Flask, request, redirect, send_from_directory, render_template_string
    from werkzeug.utils import secure_filename
    import psycopg2

    UPLOAD_DIR = "/data/uploads"
    app = Flask(__name__)

    def db():
        return psycopg2.connect(
            host=os.environ.get("DB_HOST", "postgres"),
            dbname=os.environ["POSTGRESQL_DATABASE"],
            user=os.environ["POSTGRESQL_USER"],
            password=os.environ["POSTGRESQL_PASSWORD"],
        )

    def init_db():
        for _ in range(30):
            try:
                with db() as c, c.cursor() as cur:
                    # serialize schema creation across workers/pods
                    cur.execute("SELECT pg_advisory_xact_lock(42)")
                    cur.execute("""CREATE TABLE IF NOT EXISTS notes (
                        id SERIAL PRIMARY KEY,
                        author TEXT NOT NULL,
                        message TEXT NOT NULL,
                        pod TEXT NOT NULL,
                        created_at TIMESTAMPTZ DEFAULT now())""")
                return
            except psycopg2.OperationalError:
                time.sleep(2)
        raise RuntimeError("database not reachable")

    PAGE = """
    <!doctype html><html><head><title>NetApp Backup Demo</title>
    <style>
     body{font-family:system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#222}
     header{background:#0067c5;color:#fff;padding:1rem 1.5rem;border-radius:8px}
     .pod{font-size:.85rem;opacity:.85}
     form{margin:1rem 0;padding:1rem;border:1px solid #ddd;border-radius:8px}
     input,textarea{width:100%;padding:.5rem;margin:.25rem 0;box-sizing:border-box}
     button{background:#0067c5;color:#fff;border:0;padding:.5rem 1rem;border-radius:4px;cursor:pointer}
     table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:.4rem;text-align:left}
     .stats{display:flex;gap:1rem}.stats div{flex:1;background:#f3f6fa;padding:.75rem;border-radius:8px}
    </style></head><body>
    <header><h1>NetApp Backup &amp; Restore Demo</h1>
    <div class="pod">Served by pod <b>{{ pod }}</b></div></header>
    <div class="stats" style="margin-top:1rem">
      <div><b>{{ notes|length }}</b><br>notes in PostgreSQL</div>
      <div><b>{{ files|length }}</b><br>files on shared volume</div>
    </div>
    <form method="post" action="/notes">
      <h3>Add a note</h3>
      <input name="author" placeholder="Your name" required>
      <textarea name="message" placeholder="Message" required></textarea>
      <button>Save note</button>
    </form>
    <form method="post" action="/upload" enctype="multipart/form-data">
      <h3>Upload a file</h3>
      <input type="file" name="file" required>
      <button>Upload</button>
    </form>
    <h3>Notes</h3>
    <table><tr><th>#</th><th>Author</th><th>Message</th><th>Pod</th><th>Created</th></tr>
    {% for n in notes %}<tr><td>{{n[0]}}</td><td>{{n[1]}}</td><td>{{n[2]}}</td><td>{{n[3]}}</td><td>{{n[4].strftime('%Y-%m-%d %H:%M:%S')}}</td></tr>{% endfor %}
    </table>
    <h3>Files</h3>
    <ul>{% for f in files %}<li><a href="/files/{{f}}">{{f}}</a></li>{% endfor %}</ul>
    </body></html>
    """

    @app.get("/")
    def index():
        with db() as c, c.cursor() as cur:
            cur.execute("SELECT id, author, message, pod, created_at FROM notes ORDER BY id DESC")
            notes = cur.fetchall()
        files = sorted(os.listdir(UPLOAD_DIR))
        return render_template_string(PAGE, notes=notes, files=files, pod=socket.gethostname())

    @app.post("/notes")
    def add_note():
        with db() as c, c.cursor() as cur:
            cur.execute("INSERT INTO notes (author, message, pod) VALUES (%s, %s, %s)",
                        (request.form["author"], request.form["message"], socket.gethostname()))
        return redirect("/")

    @app.post("/upload")
    def upload():
        f = request.files["file"]
        name = secure_filename(f.filename)
        if name:
            f.save(os.path.join(UPLOAD_DIR, name))
        return redirect("/")

    @app.get("/files/<path:name>")
    def files(name):
        return send_from_directory(UPLOAD_DIR, name)

    @app.get("/healthz")
    def healthz():
        with db() as c, c.cursor() as cur:
            cur.execute("SELECT 1")
        return "ok"

    os.makedirs(UPLOAD_DIR, exist_ok=True)
    init_db()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webapp-demo-napp
  labels:
    app: frontend
    app.kubernetes.io/part-of: webapp-demo
    app.openshift.io/runtime: python
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"postgres"}]'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        openshift.io/required-scc: nonroot-v2
    spec:
      serviceAccountName: webapp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001   # default user of the UBI python image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: registry.access.redhat.com/ubi9/python-311:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install --quiet --no-cache-dir flask==3.0.3 psycopg2-binary==2.9.9 gunicorn==22.0.0 &&
              exec gunicorn --chdir /app -b 0.0.0.0:8080 -w 2 app:app
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: DB_HOST
              value: postgres
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: code
              mountPath: /app
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: code
          configMap:
            name: frontend-code
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: webapp-demo-napp
  labels:
    app.kubernetes.io/part-of: webapp-demo
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
