# ONTAP credentials for Trident (used by the primary and the DR backend). Fill in:
#   ${ONTAP_USERNAME} ${ONTAP_PASSWORD}   a cluster-level ONTAP account (e.g. admin), so
#                                         Trident can manage SnapMirror between SVMs
# Don't commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: ontap-credentials
  namespace: trident
type: Opaque
stringData:
  username: ${ONTAP_USERNAME}
  password: ${ONTAP_PASSWORD}
