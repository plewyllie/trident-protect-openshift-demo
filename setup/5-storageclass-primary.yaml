# Storage class for the app's volumes, pinned to the primary SVM. The selector matters
# once a DR backend exists: without it, a storage class matches every backend of its type
# and new PVCs could land on the DR SVM.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-nas-sc
provisioner: csi.trident.netapp.io
parameters:
  backendType: ontap-nas
  selector: "site=primary"
allowVolumeExpansion: true
